<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="780" height="480" fill="url(#bg3)" rx="12"/>
  <rect width="780" height="480" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Window chrome -->
  <circle cx="24" cy="24" r="6" fill="#f85149"/>
  <circle cx="44" cy="24" r="6" fill="#e3b341"/>
  <circle cx="64" cy="24" r="6" fill="#3fb950"/>
  <text x="390" y="29" fill="#8b949e" font-size="11" text-anchor="middle">ai-sql-agent — pipeline failure diagnosis</text>
  <line x1="0" y1="42" x2="780" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Airflow failure event -->
  <text x="20" y="68" fill="#f85149" font-size="11">AIRFLOW FAILURE DETECTED  [02:47:33 UTC]</text>
  <text x="20" y="84" fill="#8b949e" font-size="11">  DAG          : fintech_daily_mart</text>
  <text x="20" y="100" fill="#8b949e" font-size="11">  Task         : dbt_run_fct_transactions</text>
  <text x="20" y="116" fill="#8b949e" font-size="11">  Error        : Database.Schema 'MARTS.FCT_TRANSACTIONS' does not exist</text>
  <text x="20" y="132" fill="#8b949e" font-size="11">  Duration     : 0m 04s  (expected 18–24m)</text>

  <line x1="20" y1="144" x2="760" y2="144" stroke="#21262d" stroke-width="1"/>

  <!-- Agent collecting context -->
  <text x="20" y="164" fill="#58a6ff" font-size="11">COLLECTING CONTEXT</text>
  <text x="20" y="180" fill="#8b949e" font-size="11">  Fetching Airflow logs...          <tspan fill="#3fb950">done</tspan></text>
  <text x="20" y="196" fill="#8b949e" font-size="11">  Querying Snowflake schema history... <tspan fill="#3fb950">done (schema dropped 02:31 UTC)</tspan></text>
  <text x="20" y="212" fill="#8b949e" font-size="11">  Checking dbt manifest...          <tspan fill="#3fb950">done</tspan></text>
  <text x="20" y="228" fill="#8b949e" font-size="11">  Checking upstream task status...  <tspan fill="#e3b341">stg_transactions SUCCEEDED</tspan></text>

  <line x1="20" y1="240" x2="760" y2="240" stroke="#21262d" stroke-width="1"/>

  <!-- Claude diagnosis -->
  <text x="20" y="260" fill="#6b48ff" font-size="11">CLAUDE DIAGNOSIS  (claude-sonnet-4-6)</text>
  <text x="20" y="278" fill="#e6edf3" font-size="11">  Root cause: MARTS schema was dropped during a failed Terraform apply at 02:31 UTC.</text>
  <text x="20" y="294" fill="#e6edf3" font-size="11">  The schema was not recreated before dbt run triggered at 02:47 UTC.</text>
  <text x="20" y="310" fill="#e6edf3" font-size="11">  Upstream data is intact. No data loss. Fix is schema re-creation only.</text>

  <line x1="20" y1="322" x2="760" y2="322" stroke="#21262d" stroke-width="1"/>

  <!-- Generated SQL fix -->
  <text x="20" y="342" fill="#3fb950" font-size="11">GENERATED FIX</text>
  <rect x="20" y="350" width="740" height="54" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="366" fill="#e3b341" font-size="11">-- Auto-generated by AI SQL Agent</text>
  <text x="32" y="382" fill="#e6edf3" font-size="11">CREATE SCHEMA IF NOT EXISTS MARTS;</text>
  <text x="32" y="398" fill="#e6edf3" font-size="11">GRANT USAGE ON SCHEMA MARTS TO ROLE TRANSFORMER;</text>

  <line x1="20" y1="416" x2="760" y2="416" stroke="#21262d" stroke-width="1"/>

  <!-- Slack delivery -->
  <text x="20" y="436" fill="#3fb950" font-size="11">SLACK DELIVERED  →  #data-oncall  (58 seconds after failure)</text>
  <text x="20" y="452" fill="#8b949e" font-size="11">  Airflow DAG rerun triggered automatically. ETA: 02:58 UTC.</text>

  <!-- Footer -->
  <text x="390" y="472" fill="#30363d" font-size="9" text-anchor="middle">github.com/Snehabankapalli/ai-sql-agent-for-data-analytics-automation</text>
</svg>
